<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url("fonts.css");
  /* Original ELDR diagram; direct HTML rendering with embedded fonts. */
  @page { size: 240pt 124.5pt; margin: 0; }
  html,body { margin:0; padding:0; }
  :root{
    --ink:#222A33; --slate:#5B6B7B; --hitfill:#EAEEF2;
    --blue:#2F6FA8; --missfill:#CFE2F2; --idc:#6b7785;
  }
  /* Keep the complete canvas visible with the wider sans-serif labels. */
  #cv{ position:relative; width:320px; height:166px;
       font-family:"DejaVu Sans",sans-serif; color:var(--ink);
       font-size:10px; }
  .blk{ position:absolute; box-sizing:border-box; display:flex; align-items:center;
        justify-content:center; }
  .hit{ border:1px solid var(--slate); background:var(--hitfill); }
  .miss{ border:1px solid var(--blue); background:var(--missfill); }
  .tok{ font-size:9.5px; color:var(--ink); }
  .res{ position:absolute; box-sizing:border-box; border:1.3px solid var(--ink);
        background:#EEF1F4; display:flex; align-items:center; justify-content:center;
        text-align:center; font-size:11px; font-weight:bold; }
  .rowlab{ position:absolute; font-size:8.6px; font-weight:bold; text-align:right; line-height:1.1; }
  .lab{ position:absolute; font-size:10px; color:var(--ink); text-align:center; white-space:nowrap; }
  .labc{ transform:translateX(-50%); }
  svg{ position:absolute; left:0; top:0; }
</style></head>
<body>
<div id="cv">

  <!-- provenance labels (top) -->
  <div class="lab labc" style="left:118px;top:7px;">Prefix Cache Hit</div>
  <div class="lab labc" style="left:250px;top:7px;">Computed</div>

  <!-- row labels -->
  <div class="rowlab" style="left:0px;top:36px;width:50px;">KV<br>Cache</div>
  <div style="position:absolute;left:0px;top:63px;width:50px;height:14px;display:flex;align-items:center;justify-content:flex-end;font-size:10px;font-weight:normal;color:#222A33;">Block&nbsp;ID</div>
  <div class="rowlab" style="left:0px;top:87px;width:50px;">Signature<br>Cache</div>

  <!-- KV cache row -->
  <div class="blk hit"  style="left:56px;top:30px;width:58px;height:28px;"><span class="tok">Translate</span></div>
  <div class="blk hit"  style="left:122px;top:30px;width:58px;height:28px;"><span class="tok">to French:</span></div>
  <div class="blk miss" style="left:188px;top:30px;width:58px;height:28px;"><span class="tok">Good</span></div>
  <div class="blk miss" style="left:254px;top:30px;width:58px;height:28px;"><span class="tok">morning</span></div>

  <!-- Signature cache row (histograms in SVG) -->
  <div class="blk hit"  style="left:56px;top:82px;width:58px;height:28px;"></div>
  <div class="blk hit"  style="left:122px;top:82px;width:58px;height:28px;"></div>
  <div class="blk miss" style="left:188px;top:82px;width:58px;height:28px;"></div>
  <div class="blk miss" style="left:254px;top:82px;width:58px;height:28px;"></div>

  <!-- result -->
  <div class="res" style="left:124px;top:136px;width:120px;height:24px;">Expert Signature</div>

  <!-- brackets, connectors, block-id badges, histograms, sum arrow -->
  <svg width="320" height="166">
    <defs>
      <marker id="mf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#222A33"/></marker>
    </defs>
    <!-- provenance brackets over the KV row -->
    <g stroke="#5B6B7B" stroke-width="0.9" fill="none"><path d="M56,25 L56,20 L180,20 L180,25"/></g>
    <g stroke="#2F6FA8" stroke-width="0.9" fill="none"><path d="M188,25 L188,20 L312,20 L312,25"/></g>

    <!-- co-index connectors + shared Block ID badges -->
    <g stroke="#AEB9C4" stroke-width="0.9" fill="none">
      <line x1="85"  y1="58" x2="85"  y2="82"/>
      <line x1="151" y1="58" x2="151" y2="82"/>
      <line x1="217" y1="58" x2="217" y2="82"/>
      <line x1="283" y1="58" x2="283" y2="82"/>
    </g>
    <g font-family="DejaVu Sans" font-size="9" font-weight="bold" text-anchor="middle" fill="#222A33">
      <circle cx="85"  cy="70" r="7.5" fill="#fff" stroke="#5B6B7B" stroke-width="1"/><text x="85"  y="72.8">0</text>
      <circle cx="151" cy="70" r="7.5" fill="#fff" stroke="#5B6B7B" stroke-width="1"/><text x="151" y="72.8">1</text>
      <circle cx="217" cy="70" r="7.5" fill="#fff" stroke="#2F6FA8" stroke-width="1"/><text x="217" y="72.8">2</text>
      <circle cx="283" cy="70" r="7.5" fill="#fff" stroke="#2F6FA8" stroke-width="1"/><text x="283" y="72.8">3</text>
    </g>

    <!-- per-block expert histograms (baseline y=105); hit=slate, miss=blue -->
    <g fill="#5B6B7B">
      <rect x="66"  y="96.5" width="4" height="8.5"/><rect x="73"  y="88.9" width="4" height="16.1"/><rect x="80"  y="98.2" width="4" height="6.8"/><rect x="87"  y="93.1" width="4" height="11.9"/><rect x="94"  y="95.7" width="4" height="9.3"/><rect x="101" y="99.9" width="4" height="5.1"/>
      <rect x="132" y="97.4" width="4" height="7.6"/><rect x="139" y="89.7" width="4" height="15.3"/><rect x="146" y="97.4" width="4" height="7.6"/><rect x="153" y="94.0" width="4" height="11.0"/><rect x="160" y="96.5" width="4" height="8.5"/><rect x="167" y="99.1" width="4" height="5.9"/>
    </g>
    <g fill="#2F6FA8">
      <rect x="198" y="90.6" width="4" height="14.4"/><rect x="205" y="98.2" width="4" height="6.8"/><rect x="212" y="94.0" width="4" height="11.0"/><rect x="219" y="99.9" width="4" height="5.1"/><rect x="226" y="89.7" width="4" height="15.3"/><rect x="233" y="96.5" width="4" height="8.5"/>
      <rect x="264" y="99.1" width="4" height="5.9"/><rect x="271" y="94.8" width="4" height="10.2"/><rect x="278" y="89.7" width="4" height="15.3"/><rect x="285" y="96.5" width="4" height="8.5"/><rect x="292" y="100.8" width="4" height="4.2"/><rect x="299" y="93.1" width="4" height="11.9"/>
    </g>

    <!-- sum bracket + Sigma + arrow to Expert Signature (row center x=184) -->
    <g stroke="#222A33" stroke-width="0.9" fill="none">
      <path d="M56,112 L56,116 L312,116 L312,112"/>
      <line x1="184" y1="116" x2="184" y2="136" marker-end="url(#mf)"/>
    </g>
    <text x="188" y="130" font-family="DejaVu Sans" font-size="14" fill="#222A33">&#931;</text>
    <text x="197" y="133" font-family="DejaVu Sans" font-size="9" fill="#222A33">0&#8211;3</text>
  </svg>

</div>
</body></html>
