<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url("fonts.css");
  /* Original ELDR diagram; direct HTML rendering with embedded fonts. */
  @page { size: 240pt 174.75pt; margin: 0; }
  html,body { margin:0; padding:0; }
  :root{
    --ink:#222A33; --cedge:#5B6B7B; --cfill:#EEF1F4;
    --aedge:#2F6FA8; --afill:#D4E6F5;
    --gedge:#AEB9C4; --gfill:#F7F8FA; --panel:#9AA6B2; --subc:#34536B;
  }
  #cv{ position:relative; width:320px; height:233px;
       font-family:"DejaVu Sans",sans-serif; color:var(--ink);
       font-size:11px; }
  .b{ position:absolute; box-sizing:border-box; border:1px solid var(--cedge);
      background:var(--cfill); display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      line-height:1.1; }
  .acc{ border-color:var(--aedge); background:var(--afill); }
  .ghost{ position:absolute; box-sizing:border-box; border:1px solid var(--gedge);
          background:var(--gfill); }
  .sub{ font-size:9px; color:var(--subc); margin-top:1px; }
  .note{ font-size:8.5px; }
  .ttl{ font-weight:bold; }
  .phase{ position:absolute; box-sizing:border-box; border:1px dashed var(--panel);
          background:transparent; }
  .tab{ position:absolute; font-size:9.5px; font-weight:bold; letter-spacing:.5px;
        color:#3A4651; }
  .lab{ position:absolute; font-size:9.5px; line-height:1.1;
        color:var(--ink); white-space:nowrap; }
  .labc{ transform:translateX(-50%); text-align:center; }
  .labr{ transform:translateX(-100%); text-align:right; }
  .badge{ position:absolute; width:13px; height:13px; border-radius:50%;
          background:var(--ink); color:#fff; font-size:8px; font-weight:bold;
          display:flex; align-items:center; justify-content:center;
          transform:translate(-50%,-50%); box-shadow:0 0 0 1.2px #fff; }
  svg{ position:absolute; left:0; top:0; }
</style></head>
<body>
<div id="cv">

  <!-- Initial and background fits share the same centroid-fitting stage. -->
  <div class="phase" style="left:4px;top:4px;width:312px;height:62px;"></div>
  <div class="tab" style="left:11px;top:9px;">Centroid fitting
      <span style="font-size:8.5px;font-weight:normal;letter-spacing:0;">(initial + async refitting)</span></div>
  <div class="b acc" style="left:20px;top:28px;width:108px;height:32px;">
      <span>Expert<br>signatures</span></div>
  <div class="b acc" style="left:192px;top:28px;width:108px;height:32px;">
      <span><i>K</i> centroids</span><span class="sub note">One per decoder</span></div>

  <!-- Request serving: step numbers match the five steps in the text. -->
  <div class="phase" style="left:4px;top:71px;width:312px;height:156px;"></div>
  <div class="tab" style="left:11px;top:75px;">Request serving</div>
  <div class="b" style="left:115px;top:90px;width:90px;height:20px;">Client</div>
  <div class="b acc" style="left:82px;top:125px;width:156px;height:34px;">
      <span class="ttl">ELDR router</span></div>

  <!-- Prefill stack (xP), left -->
  <div class="ghost" style="left:26px;top:182px;width:108px;height:31px;"></div>
  <div class="ghost" style="left:22px;top:186px;width:108px;height:31px;"></div>
  <div class="b" style="left:18px;top:190px;width:108px;height:31px;">
      <span class="ttl">Prefill &times;&nbsp;<i>x</i></span><span class="sub">Signature cache</span></div>

  <!-- Decode stack (yD), right -->
  <div class="ghost" style="left:202px;top:182px;width:108px;height:31px;"></div>
  <div class="ghost" style="left:198px;top:186px;width:108px;height:31px;"></div>
  <div class="b" style="left:194px;top:190px;width:108px;height:31px;">
      <span class="ttl">Decode &times;&nbsp;<i>y</i></span></div>

  <!-- Solid: processing flow; dashed: KV; dotted: routing-state updates. -->
  <svg width="320" height="233">
    <defs>
      <marker id="mf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#222A33"/></marker>
    </defs>
    <!-- request / response flow: solid -->
    <g stroke="#222A33" stroke-width="1" fill="none">
      <line x1="128" y1="44" x2="192" y2="44" marker-end="url(#mf)"/>
      <line x1="150" y1="110" x2="150" y2="125" marker-end="url(#mf)"/>
      <line x1="170" y1="125" x2="170" y2="110" marker-end="url(#mf)"/>
      <line x1="93" y1="159" x2="67" y2="190" marker-end="url(#mf)"/>
      <line x1="118" y1="190" x2="124" y2="159" marker-end="url(#mf)"/>
      <line x1="218" y1="159" x2="249" y2="190" marker-end="url(#mf)"/>
    </g>
    <!-- KV transfer: dashed -->
    <g stroke="#222A33" stroke-width="1" fill="none" stroke-dasharray="4,2">
      <line x1="126" y1="211" x2="194" y2="211" marker-end="url(#mf)"/>
    </g>
    <!-- The router reads current centroids without waiting for refitting. -->
    <g stroke="#222A33" stroke-width="1.1" fill="none" stroke-dasharray="1,2.5" stroke-linecap="round">
      <path d="M246,60 V142 H238" marker-end="url(#mf)"/>
    </g>
  </svg>

  <div class="lab labc" style="left:160px;top:31px;">Balanced</div>
  <div class="lab labc" style="left:160px;top:47px;"><i>K</i>-means</div>

  <!-- client I/O -->
  <div class="lab labr" style="left:142px;top:112px;">Request</div>
  <div class="lab" style="left:178px;top:112px;">Response</div>
  <div class="lab labc" style="left:44px;top:161px;">Prefix-aware<br>routing</div>
  <div class="lab labc" style="left:153px;top:160px;">Expert<br>signature</div>
  <div class="lab labc" style="left:278px;top:161px;">Locality-band<br>routing</div>
  <div class="lab labc" style="left:163px;top:193px;">KV transfer</div>

  <!-- step badges (all ink), numbered to match the text's 5 online steps -->
  <div class="badge" style="left:81px;top:174.5px;">1</div>
  <div class="badge" style="left:25px;top:213px;">2</div>
  <div class="badge" style="left:121px;top:174.5px;">3</div>
  <div class="badge" style="left:233px;top:174.5px;">4</div>
  <div class="badge" style="left:160px;top:211px;">5</div>

</div>
</body></html>
