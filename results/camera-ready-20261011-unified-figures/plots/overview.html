<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url("fonts.css");
  /* Original ELDR diagram; direct HTML rendering with embedded fonts. */
  @page { size: 240pt 194.25pt; margin: 0; }
  html,body { margin:0; padding:0; }
  :root{
    --ink:#222A33; --cedge:#5B6B7B; --cfill:#EEF1F4;
    --aedge:#2F6FA8; --afill:#D4E6F5;
    --gedge:#AEB9C4; --gfill:#F7F8FA; --panel:#9AA6B2; --subc:#34536B;
  }
  #cv{ position:relative; width:320px; height:259px;
       font-family:"DejaVu Sans",sans-serif; color:var(--ink);
       font-size:11px; }
  .b{ position:absolute; box-sizing:border-box; border:1px solid var(--cedge);
      background:var(--cfill); display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      line-height:1.1; }
  .acc{ border-color:var(--aedge); background:var(--afill); }
  .ghost{ position:absolute; box-sizing:border-box; border:1px solid var(--gedge);
          background:var(--gfill); }
  .sub{ font-size:9px; color:var(--subc); margin-top:1px; }
  .note{ font-size:8.5px; }
  .ttl{ font-weight:bold; }
  .phase{ position:absolute; box-sizing:border-box; border:1px dashed var(--panel);
          background:transparent; }
  .tab{ position:absolute; font-size:9.5px; font-weight:bold; letter-spacing:.5px;
        color:#3A4651; }
  .lab{ position:absolute; font-size:9.5px; line-height:1.1;
        color:var(--ink); white-space:nowrap; }
  .labc{ transform:translateX(-50%); text-align:center; }
  .labr{ transform:translateX(-100%); text-align:right; }
  .badge{ position:absolute; width:13px; height:13px; border-radius:50%;
          background:var(--ink); color:#fff; font-size:8px; font-weight:bold;
          display:flex; align-items:center; justify-content:center;
          transform:translate(-50%,-50%); box-shadow:0 0 0 1.2px #fff; }
  svg{ position:absolute; left:0; top:0; }
</style></head>
<body>
<div id="cv">

  <!-- Initial and background fits share the same centroid-fitting stage. -->
  <div class="phase" style="left:4px;top:4px;width:312px;height:70px;"></div>
  <div class="tab" style="left:11px;top:9px;">Centroid fitting
      <span style="font-size:8.5px;font-weight:normal;letter-spacing:0;">(initial + async refitting)</span></div>
  <div class="b acc" style="left:18px;top:30px;width:98px;height:35px;">
      <span>Expert<br>signatures</span></div>
  <div class="b acc" style="left:134px;top:30px;width:70px;height:35px;">
      <span>Balanced</span><span><i>K</i>-means</span></div>
  <div class="b acc" style="left:228px;top:30px;width:74px;height:35px;">
      <span><i>K</i> centroids</span><span class="sub note">one per decoder</span></div>

  <!-- Request serving: step numbers match the five steps in the text. -->
  <div class="phase" style="left:4px;top:79px;width:312px;height:174px;"></div>
  <div class="tab" style="left:11px;top:83px;">Request serving</div>
  <div class="b" style="left:115px;top:100px;width:90px;height:22px;">Client</div>
  <div class="b acc" style="left:82px;top:142px;width:156px;height:40px;">
      <span class="ttl">ELDR Router</span></div>

  <!-- Prefill stack (xP), left -->
  <div class="ghost" style="left:26px;top:208px;width:108px;height:31px;"></div>
  <div class="ghost" style="left:22px;top:212px;width:108px;height:31px;"></div>
  <div class="b" style="left:18px;top:216px;width:108px;height:31px;">
      <span class="ttl">Prefill &times;&nbsp;<i>x</i></span><span class="sub">signature cache</span></div>

  <!-- Decode stack (yD), right -->
  <div class="ghost" style="left:202px;top:208px;width:108px;height:31px;"></div>
  <div class="ghost" style="left:198px;top:212px;width:108px;height:31px;"></div>
  <div class="b" style="left:194px;top:216px;width:108px;height:31px;">
      <span class="ttl">Decode &times;&nbsp;<i>y</i></span><span class="sub">generate tokens</span></div>

  <!-- Solid: foreground; dashed: KV; blue dotted: routing-state updates. -->
  <svg width="320" height="259">
    <defs>
      <marker id="mf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#222A33"/></marker>
      <marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2F6FA8"/></marker>
    </defs>
    <!-- request / response flow: solid -->
    <g stroke="#222A33" stroke-width="1" fill="none">
      <line x1="116" y1="47.5" x2="134" y2="47.5" marker-end="url(#mf)"/>
      <line x1="204" y1="47.5" x2="228" y2="47.5" marker-end="url(#mf)"/>
      <line x1="150" y1="122" x2="150" y2="142" marker-end="url(#mf)"/>
      <line x1="170" y1="142" x2="170" y2="122" marker-end="url(#mf)"/>
      <line x1="93" y1="182" x2="67" y2="216" marker-end="url(#mf)"/>
      <line x1="118" y1="216" x2="124" y2="182" marker-end="url(#mf)"/>
      <line x1="218" y1="182" x2="249" y2="216" marker-end="url(#mf)"/>
    </g>
    <!-- KV transfer: dashed -->
    <g stroke="#222A33" stroke-width="1" fill="none" stroke-dasharray="4,2">
      <line x1="126" y1="237" x2="194" y2="237" marker-end="url(#mf)"/>
    </g>
    <!-- The router reads current centroids without waiting for refitting. -->
    <g stroke="#2F6FA8" stroke-width="1.1" fill="none" stroke-dasharray="1,2.5" stroke-linecap="round">
      <path d="M302,47.5 H312 V157 H238" marker-end="url(#ms)"/>
    </g>
  </svg>

  <!-- client I/O -->
  <div class="lab labr" style="left:142px;top:126px;">request</div>
  <div class="lab" style="left:178px;top:126px;">response</div>
  <div class="lab labc" style="left:44px;top:184px;">prefix-aware<br>routing</div>
  <div class="lab labc" style="left:161px;top:188px;">expert<br>signature</div>
  <div class="lab labc" style="left:278px;top:184px;">locality-band<br>routing</div>
  <div class="lab labc" style="left:163px;top:219px;">KV transfer</div>

  <!-- step badges (all ink), numbered to match the text's 5 online steps -->
  <div class="badge" style="left:81px;top:198px;">1</div>
  <div class="badge" style="left:25px;top:239px;">2</div>
  <div class="badge" style="left:121px;top:198px;">3</div>
  <div class="badge" style="left:233px;top:198px;">4</div>
  <div class="badge" style="left:160px;top:237px;">5</div>

</div>
</body></html>
